  <title id="roomTitle">Ananya in the empty Room 2</title>
  <desc id="roomDesc">Mid-morning in Room 2, the wrong room. It is empty: plastic chairs are stacked in a corner, dusty light comes through a window, and the board is blank. The door is open, and the corridor with its green band can be seen outside. The hand-painted board on the door says Room 2. Ananya, in her teal kurta, holding her folder of papers, stands just inside the door, looking unsure, with an empty speech bubble above her.</desc>
